# Builds and tests the host build, then the firmware image of every board in
# firmware/boards (found by ci/list-boards.sh, so new boards build without
# touching this file). Images are uploaded as artifacts; on a v* tag they are
# attached to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S firmware -B build
          cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  boards:
    name: list boards
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(ci/list-boards.sh)" >> "$GITHUB_OUTPUT"

  firmware:
    name: ${{ matrix.board }}
    needs: boards
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe names the image
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # the Beken SDK's packager calls `python`
      - name: Cache SDK and toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/librecam
          key: sdk-${{ matrix.hal }}-${{ hashFiles('ci/build-board.sh') }}
      - name: Build
        run: ci/build-board.sh "${{ matrix.board }}"
      - uses: actions/upload-artifact@v4
        with:
          name: librecam-${{ matrix.board }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: librecam-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "LibreCam $GITHUB_REF_NAME" --generate-notes
